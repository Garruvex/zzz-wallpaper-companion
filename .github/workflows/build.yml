name: Build

on:
  push:
    tags:
      - "v*"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: go test ./...

  build:
    needs: test
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Generate Windows resources
        run: go run github.com/akavel/rsrc@v0.10.2 -ico winres/icon.ico -arch ${{ matrix.arch }} -o rsrc_windows_${{ matrix.arch }}.syso
      - name: Build Windows executable
        shell: pwsh
        run: |
          $env:GOOS = "windows"
          $env:GOARCH = "${{ matrix.arch }}"
          $version = if ($env:GITHUB_REF_TYPE -eq "tag") { $env:GITHUB_REF_NAME.TrimStart("v") } else { "1.1.0" }
          go build -trimpath -ldflags "-H=windowsgui -s -w -X main.version=$version -X main.buildNumber=${{ github.run_number }}" -o "dist/zzz-wallpaper-companion-windows-${{ matrix.arch }}.exe" .
      - uses: actions/upload-artifact@v4
        with:
          name: zzz-wallpaper-companion-windows-${{ matrix.arch }}
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: zzz-wallpaper-companion-windows-*
          path: dist
          merge-multiple: true
      - name: Create verified update manifest
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME.TrimStart("v")
          $assets = @{}
          foreach ($arch in @("amd64", "arm64")) {
            $name = "zzz-wallpaper-companion-windows-$arch.exe"
            $hash = (Get-FileHash -Algorithm SHA256 (Join-Path "dist" $name)).Hash.ToLowerInvariant()
            $assets["windows-$arch"] = @{ name = $name; sha256 = $hash }
          }
          $manifest = @{
            version = $version
            protocolMin = 2
            protocolMax = 2
            assets = $assets
          } | ConvertTo-Json -Depth 4
          Set-Content -LiteralPath "dist/zzz-wallpaper-companion-update.json" -Value $manifest -Encoding utf8
      - name: Publish GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$env:GITHUB_REF_NAME" dist/* --verify-tag --generate-notes
