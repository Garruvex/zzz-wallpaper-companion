<!doctype html>
<html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Important Dates · ZZZ Companion</title>
<style>:root{color-scheme:dark;font:16px Segoe UI,sans-serif;background:#111315;color:#f3f4f4}body{max-width:680px;margin:auto;padding:32px 22px}a{color:#d8f51b}h1{margin-bottom:8px}p{color:#aeb5b8;line-height:1.5}form{display:grid;gap:16px;padding:24px 0;border-block:1px solid #34383a}label{display:grid;gap:6px}input,select,button{font:inherit;padding:10px;border:1px solid #4a5053;border-radius:4px;background:#1c2022;color:white}input[type=checkbox]{width:auto}button{cursor:pointer}button[type=submit]{background:#d8f51b;color:#171717;font-weight:bold}.actions{display:flex;gap:8px;flex-wrap:wrap}li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:16px 0;border-bottom:1px solid #34383a}ul{padding:0;list-style:none}li span{overflow-wrap:anywhere}small{display:block;color:#aeb5b8;margin-top:5px}#status{min-height:24px;color:#d8f51b}</style><link rel="stylesheet" href="/ui/theme.css"><script defer src="/ui/shell.js"></script><script src="/ui/api.js"></script>
<a href="/settings">← Companion settings</a><h1>Important Dates</h1>
<form id="dateForm" novalidate><label>Name<input id="eventName" maxlength="80" required placeholder="Alex’s birthday"></label><label>Date<input id="eventDate" type="date" min="1000-01-01" max="9999-12-31" required></label><label>Type<select id="eventKind"><option value="birthday">Birthday</option><option value="custom">Event</option></select></label><label><span><input id="eventYearly" type="checkbox" checked> Repeat every year</span></label><div class="actions"><button id="save" type="submit" disabled>Save date</button><button id="cancel" type="button" class="zzz-chipbtn">Clear form</button></div></form><p id="status" role="status"></p><ul id="dates"></ul>
<script>
const $=id=>document.getElementById(id);let documentData=null,editing=null,busy=false;
function clearForm(){editing=null;$('dateForm').reset();$('save').textContent='Save date'}
function render(){const list=$('dates');list.replaceChildren();for(const event of [...documentData.events].sort((a,b)=>a.date.localeCompare(b.date)||a.name.localeCompare(b.name))){const kind=document.createElement('span'),when=document.createElement('small'),buttons=document.createElement('div');kind.className='chip';kind.textContent=event.kind==='birthday'?'BIRTHDAY':'EVENT';when.textContent=event.date+' · '+t(event.yearly?'Every year':'Once');buttons.className='actions';for(const [label,action] of [['Edit',()=>{editing=event.id;$('eventName').value=event.name;$('eventDate').value=event.date;$('eventKind').value=event.kind;$('eventYearly').checked=event.yearly;$('save').textContent='Save changes';$('eventName').focus()}],['Delete',()=>persist(documentData.events.filter(item=>item.id!==event.id)).then(ok=>{if(ok&&editing===event.id)clearForm()})]]){const button=document.createElement('button');button.textContent=label;button.type='button';button.className='zzz-chipbtn';button.disabled=busy;button.addEventListener('click',action);buttons.append(button)}list.append(companionCard(document,Object.assign(document.createElement('span'),{textContent:event.name,translate:false}),{tag:'li',tools:[kind],body:[when,buttons]}))}if(!documentData.events.length)list.textContent='No important dates yet.'}
async function persist(events){if(busy||!documentData)return false;busy=true;$('save').disabled=true;render();companionSay('Saving…');try{const data=await CompanionAPI.request('dates.save',{body:{...documentData,events}});documentData=data;companionSay('Saved. The wallpaper updates within 15 seconds.');return true}catch(error){companionSay(error.message,'error');return false}finally{busy=false;$('save').disabled=false;render()}}
$('eventKind').addEventListener('change',()=>{$('eventYearly').checked=$('eventKind').value==='birthday'});$('cancel').addEventListener('click',clearForm);$('dateForm').addEventListener('submit',async event=>{event.preventDefault();if(!documentData||busy)return;const item={id:editing||(crypto.randomUUID?crypto.randomUUID():Date.now()+'-'+Math.random().toString(36).slice(2)),name:$('eventName').value.trim(),date:$('eventDate').value,kind:$('eventKind').value,yearly:$('eventYearly').checked};if(!item.name){companionSay('Enter a name for the date.','error');return}if(!item.date){companionSay('Pick a date.','error');return}if(await persist([...documentData.events.filter(entry=>entry.id!==item.id),item]))clearForm()});
(async()=>{try{const data=await CompanionAPI.request('dates.list');documentData=data;render();$('save').disabled=false;companionSay('')}catch(error){companionSay(error.message+' '+t('Reload this page to retry.'),'error')}})();
</script></html>
