<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Games · ZZZ Companion</title>
<style>
:root{color-scheme:dark;font:16px Segoe UI,sans-serif;background:#111315;color:#f3f4f4;--accent:#d8f51b;--line:#34383a;--muted:#aeb5b8}
body{margin:0}.bar{height:5px;background:var(--accent)}main{max-width:760px;margin:auto;padding:32px 22px}
a{color:var(--accent)}h1{margin:8px 0}p{color:var(--muted);line-height:1.5}
button,.button{font:inherit;padding:8px 14px;border:1px solid #4a5053;border-radius:4px;background:#1c2022;color:#fff;cursor:pointer;white-space:nowrap}
button:disabled{opacity:.5;cursor:default}button.primary{background:var(--accent);border-color:var(--accent);color:#171717;font-weight:700}
button.danger{border-color:#7a3b3b;color:#ffb4b4}
#drop{display:grid;place-items:center;gap:8px;padding:28px;border:2px dashed #4a5053;border-radius:8px;text-align:center;color:var(--muted);margin:22px 0}
#drop.over{border-color:var(--accent);color:#fff;background:#1a1d10}
#drop input{display:none}
#status{min-height:24px;color:var(--accent)}
.game{border-top:1px solid var(--line);padding:16px 0}.game:last-child{border-bottom:1px solid var(--line)}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}.title{flex:1;min-width:180px}
.title b{display:block;overflow-wrap:anywhere}.title small{color:var(--muted)}
.saves{margin:12px 0 0;padding:14px;border-radius:6px;background:#181b1d;display:grid;gap:10px}
.saves .line{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.tape-pen{flex:none;display:grid;place-items:center;width:24px;height:24px;margin:0;padding:0;border:0;border-radius:50%;background:none;color:#8b8f96;cursor:pointer}
.tape-pen svg{width:15px;height:15px}
.tape-pen:focus-visible,.tape-pen:active{outline:none;color:var(--zzz-lime)}
.tape-title input.rename-field{flex:1 1 auto;box-sizing:border-box;width:auto;max-width:360px;min-width:0;height:30px!important;min-height:0!important;padding:0 12px!important;border-width:2px!important;font-size:15px!important;line-height:1!important}
#cache .line{display:flex;justify-content:space-between;align-items:center;gap:16px;padding:8px 4px 10px}
#cache .line small{flex:1 1 auto;line-height:1.5}
#cache button.zzz-chipbtn{flex:0 0 auto;padding:4px 14px;font-size:12px;border-width:2px;white-space:nowrap}
.saves small{color:var(--muted)}
.empty{color:var(--muted);padding:18px 0}
button.shelf.on{background:#1a1d10;border-color:var(--accent);color:var(--accent)}
#shelfNote{margin:0}
.game.locked .tape-title{opacity:.45}
</style><link rel="stylesheet" href="/ui/theme.css"><script defer src="/ui/shell.js"></script><script src="/ui/api.js"></script></head><body><div class="bar"></div><main>
<a href="/settings">← Companion settings</a>
<h1>Games</h1>
<label id="drop"><input id="file" type="file" accept=".gba,.gbc,.gb,.nes,.sfc,.smc,.md,.gen,.smd,.sms,.gg,.bin,.img,.pbp,.chd" multiple><b>Drop game files here or click to choose</b><span>GBA, Game Boy, NES, SNES, Mega Drive, Master System, Game Gear · Experimental: PS1 (.bin/.img/.pbp/.chd)<span class="psp" hidden>, PSP (.iso/.cso/.elf)</span></span></label>
<p class="note">PS1: single-file games only, no CUE/BIN sets or disc swapping.<span class="psp" hidden> PSP: some games may hang; saves download as a .zzzpsp file.</span></p>
<p id="shelfNote"></p>
<p id="status" role="status"></p>
<div id="games" aria-label="Game library"></div>
<input id="importFile" type="file" hidden>
<div id="pad" aria-label="Controller"></div>
<div id="keys" aria-label="Keyboard"></div>
<div id="cache" aria-label="Storage"></div>
<script>
const $ = id => document.getElementById(id);
const SYSTEMS = { gba: 'GBA', nes: 'NES', snes: 'SNES', segaMD: 'MEGA DRIVE', segaMS: 'MASTER SYSTEM', segaGG: 'GAME GEAR', psx: 'PS1 · EXPERIMENTAL', psp: 'PSP · EXPERIMENTAL' };
let carts = [], current = { id: '', seq: 0 }, open = new Set(), details = {}, busy = false;
let renaming = ''; // the game whose name is being edited
let dragId = ''; // the game being dragged to another tape
// While PSP is locked its games stay on their tapes, greyed out and unplayable, and PSP files are not offered.
let psp = { unlocked: false, locked: [] };
const PSP_FILES = ',.iso,.cso,.elf';

const api = (id, parameters) => CompanionAPI.request(id, parameters);
const when = iso => iso ? new Date(iso).toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }) : '';
const size = bytes => bytes < 1024 ? `${bytes} B` : `${(bytes / 1024).toFixed(bytes < 10240 ? 1 : 0)} KB`;
const say = (text, kind) => companionSay(text, kind);
let loaded = false;
say('Loading games…');
const el = (tag, props = {}, ...children) => { const node = Object.assign(document.createElement(tag), props); node.append(...children); return node; };
// Small buttons are all the same: the kit's chip button, restyled as the game's black pill.
const button = (label, action) => el('button', { type: 'button', className: 'zzz-chipbtn', textContent: label, disabled: busy, onclick: action });

async function run(message, task) {
  if (busy) return;
  busy = true; render();
  try { const result = await task(); say(typeof result === 'string' && result ? result : message); } catch (error) { say(error.message, 'error'); }
  finally { busy = false; await refresh(); }
}

async function refresh() {
  try {
    [{ carts }, current, psp] = await Promise.all([api('games.carts.list'), api('games.selection.get'), pspLock()]);
    await Promise.all([...open].map(async id => { details[id] = await api("games.carts.details", { path: { id } }).catch(() => null); }));
    if (!loaded) { loaded = true; say(''); }
  } catch (error) { say('Could not reach the companion.', 'error'); }
  render();
}

function savesPanel(cart) {
  const info = details[cart.id];
  if (!info) return el('div', { className: 'saves' }, 'Loading…');
  const fileUrl = file => CompanionAPI.url('games.carts.file.get', { path: { id: cart.id, file }, query: { download: 1 } });
  const action = (action, query = {}) => api('games.carts.action', { path: { id: cart.id, action }, query });
  const panel = el('div', { className: 'saves' });
  const save = info.save;
  panel.append(el('div', { className: 'line' },
    el('span', {}, el('b', { textContent: 'Game save ' }), el('small', { textContent: save ? `${size(save.size)} · ${when(save.modified)}` : 'none yet' })),
    el('span', { className: 'row' },
      save ? el('a', { className: 'zzz-chipbtn', href: fileUrl('save'), textContent: 'Download' }) : '',
      button('Import…', () => importSave(cart)))));
  panel.append(el('div', { className: 'line' },
    el('span', {}, el('b', { textContent: 'Resume point ' }), el('small', { textContent: info.state ? `where you left off · ${when(info.state.modified)}` : 'none yet' }))));
  for (const point of info.states) {
    panel.append(el('div', { className: 'line' },
      el('small', { textContent: `Earlier resume point · ${when(point.modified)}` }),
      button('Go back to this', async () => {
        if (await companionConfirm({ title: 'Go back to this resume point?', message: `From ${when(point.modified)}. The current one is kept in the game's backups folder.`, confirmLabel: 'Go back' }))
          run('Restored. The TV reloads the game if it is playing it.', () => action('restore', { state: point.n }));
      })));
  }
  panel.append(el('div', { className: 'line' },
    el('small', { textContent: 'Kept in the game\'s backups folder.' }),
    button('Delete save', async () => {
      if (await companionConfirm({ title: 'Delete the save?', message: `${cart.title} starts from the beginning next time. Its save and resume points move to its backups folder.`, confirmLabel: 'Delete' }))
        run('Save deleted.', () => action('reset'));
    }, 'danger')));
  panel.append(el('div', { className: 'line' },
    el('small', { textContent: 'Kept until you clear the cache in Storage.' }),
    button('Remove game', async () => {
      if (await companionConfirm({ title: `Remove ${cart.title}?`, message: 'It comes off the shelf. The game and its saves are kept until you clear the cache in Storage.', confirmLabel: 'Remove' }))
        run(`${cart.title} removed.`, () => api('games.carts.action', { path: { id: cart.id, action: 'remove' } }));
    }, 'danger')));
  return panel;
}

function importSave(cart) {
  const input = $('importFile');
  input.value = '';
  input.onchange = async () => {
    const file = input.files[0];
    if (!file || !await companionConfirm({ title: `Use ${file.name} as the save?`, message: `${cart.title} starts from that save. The current save and resume points move to its backups folder.`, confirmLabel: 'Use it' })) return;
    run('Save imported.', () => api('games.carts.action', { path: { id: cart.id, action: 'import' }, body: file }));
  };
  input.click();
}

// The Library is the shelf and the pile. The shelf is packed from tape 01 (the numbers on the tapes'
// tags in the wallpaper): a game added goes on the end and taking one off closes the gap. Every other
// game is in the pile, where game files can be dropped too. Drag a game to reorder the shelf, up onto
// it from the pile, or down to the pile; + and − do the same with a click.
const SLOTS = 14;
const tapeText = tape => String(tape).padStart(2, '0');

function render() {
  if (visit.signal.aborted) return; // a reply that lands after leaving the tab
  $('file').accept = $('file').accept.replace(PSP_FILES, '') + (psp.unlocked ? PSP_FILES : '');
  for (const node of document.querySelectorAll('.psp')) node.hidden = !psp.unlocked;
  $('shelfNote').textContent = '';
  const list = $('games');
  list.replaceChildren();
  if (!carts.length) { list.append(el('p', { className: 'empty', textContent: 'No games yet. Add one in Add Games.' })); return; }
  const shelf = carts.filter(cart => cart.tape).sort((a, b) => a.tape - b.tape);
  const pile = carts.filter(cart => !cart.tape);
  const full = shelf.length >= SLOTS;
  const head = (title, count) => el('div', { className: 'lib-head' }, el('h2', { className: 'group-title', textContent: title }), el('span', { className: 'lib-count', textContent: count }));
  const shelfBox = el('section', { className: 'lib-shelf' }, head('On the shelf', `${shelf.length} / ${SLOTS}`));
  for (const cart of shelf) shelfBox.append(gameRow(cart, full));
  shelfBox.append(el('div', { className: 'lib-end', textContent: full ? 'The shelf is full. Take a game off to make room.' : `Drag a game here to put it on tape ${tapeText(shelf.length + 1)}.` }));
  const pileBox = el('section', { className: 'lib-pile' }, head('Not on the shelf', String(pile.length)));
  for (const cart of pile) pileBox.append(gameRow(cart, full));
  pileBox.append(el('div', { className: 'lib-end', textContent: 'Drop a game here to take it off the shelf, or drop game files to add them.' }));
  list.append(shelfBox, pileBox);
  shelfDrop(shelfBox, shelf);
  pileDrop(pileBox);
}

const moveTo = (cart, tape) => run(`${cart.title} is on tape ${tapeText(tape)}.`, () => api('games.carts.action', { path: { id: cart.id, action: 'tape' }, query: { n: tape } }));
const putOnShelf = (cart, on) => run(on ? `${cart.title} is on the shelf.` : `${cart.title} is off the shelf.`, () => api('games.carts.action', { path: { id: cart.id, action: 'shelf' }, query: { on: on ? 1 : 0 } }));
const clearDrop = () => document.querySelectorAll('.drop-line,.is-over').forEach(node => node.classList.contains('drop-line') ? node.remove() : node.classList.remove('is-over'));

// Over the shelf, a lime line shows where the game will go in. The tape it lands on comes from the rows
// above the pointer; a game moving down leaves a gap above it, so it lands one less.
function shelfDrop(box, shelf) {
  let index = -1;
  const rows = () => [...box.querySelectorAll(':scope > .tape-row, :scope > .tape-item')];
  box.addEventListener('dragover', event => {
    if (!dragId) return;
    event.preventDefault();
    const list = rows();
    const next = list.filter(row => { const rect = row.getBoundingClientRect(); return rect.top + rect.height / 2 < event.clientY; }).length;
    if (next === index && box.querySelector('.drop-line')) return;
    index = next;
    clearDrop();
    box.insertBefore(el('div', { className: 'drop-line' }), list[index] || box.querySelector('.lib-end'));
  });
  box.addEventListener('dragleave', event => { if (!box.contains(event.relatedTarget)) { clearDrop(); index = -1; } });
  box.addEventListener('drop', event => {
    event.preventDefault();
    clearDrop();
    const cart = carts.find(item => item.id === dragId);
    dragId = '';
    const at = index;
    index = -1;
    if (!cart || at < 0) return;
    const tape = Math.max(1, cart.tape && at >= cart.tape ? at : at + 1);
    if (tape === cart.tape) return;
    if (!cart.tape && shelf.length >= SLOTS) { say('The shelf is full. Take a game off it first.', 'error'); return; }
    moveTo(cart, tape);
  });
}

function pileDrop(box) {
  const files = event => [...(event.dataTransfer?.types || [])].includes('Files');
  box.addEventListener('dragover', event => { if (dragId || files(event)) { event.preventDefault(); box.classList.add('is-over'); } });
  box.addEventListener('dragleave', event => { if (!box.contains(event.relatedTarget)) box.classList.remove('is-over'); });
  box.addEventListener('drop', event => {
    event.preventDefault();
    box.classList.remove('is-over');
    if (!dragId) { if (event.dataTransfer.files.length) upload([...event.dataTransfer.files]); return; }
    const cart = carts.find(item => item.id === dragId);
    dragId = '';
    if (cart?.tape) putOnShelf(cart, false);
  });
}

// One line per game. On the shelf: a grip, its tape number, the title and tags, play, − and the fold
// button for its saves. In the pile the same without the number, and + instead of −.
function gameRow(cart, full) {
  const locked = Boolean(cart.locked);
  const onTV = current.id === cart.id;
  const shown = open.has(cart.id);
  const tape = cart.tape || 0;
  const grip = el('span', { className: 'tape-grip', tabIndex: 0, title: tape ? 'Drag to move. Up and down arrows move it too.' : 'Drag onto the shelf' });
  grip.setAttribute('role', 'button');
  grip.setAttribute('aria-label', tape ? `Move ${cart.title}, on tape ${tape}. Press up or down to move it` : `Move ${cart.title} onto the shelf`);
  grip.addEventListener('keydown', event => {
    const up = event.key === 'ArrowUp', down = event.key === 'ArrowDown';
    if (!tape || busy || !(up || down)) return;
    event.preventDefault();
    const target = tape + (up ? -1 : 1);
    if (target >= 1 && target <= carts.filter(item => item.tape).length) moveTo(cart, target);
  });
  // The pen renames the game: only its name changes, its saves and tape stay. Enter saves, Escape
  // cancels, and an empty name goes back to the game file's name.
  const editing = renaming === cart.id;
  let nameBox;
  if (editing) {
    nameBox = el('input', { type: 'text', className: 'rename-field', value: cart.title, maxLength: 40, placeholder: cart.id });
    nameBox.setAttribute('aria-label', `New name for ${cart.title}. Enter saves, Escape cancels`);
    const finish = save => {
      if (renaming !== cart.id) return;
      renaming = '';
      const next = nameBox.value.trim();
      if (!save || next === cart.title || (!next && cart.title === cart.id)) { render(); return; }
      run(next ? `Renamed to ${next}.` : 'Name set back to the file name.', () => companionRenameGame(cart.id, next));
    };
    nameBox.addEventListener('keydown', event => {
      event.stopPropagation();
      if (event.key === 'Enter') { event.preventDefault(); finish(true); }
      if (event.key === 'Escape') { event.preventDefault(); finish(false); }
    });
    nameBox.addEventListener('blur', () => finish(true));
    requestAnimationFrame(() => { nameBox.focus(); nameBox.select(); });
  }
  const pen = editing ? '' : el('button', { type: 'button', className: 'tape-pen', title: 'Rename', disabled: busy,
    innerHTML: '<svg viewBox="0 0 16 16" aria-hidden="true"><path fill="currentColor" d="M11.3 1.3a1.5 1.5 0 0 1 2.1 0l1.3 1.3a1.5 1.5 0 0 1 0 2.1L5.5 13.9 1.5 14.5l.6-4z"/></svg>',
    onclick: () => { renaming = cart.id; render(); } });
  if (pen) pen.setAttribute('aria-label', `Rename ${cart.title}`);
  const title = el('span', { className: 'tape-title', title: cart.rom },
    editing ? nameBox : el('b', { textContent: cart.title }), pen,
    onTV ? el('span', { className: 'chip on', textContent: 'ON TV' }) : '');
  // The system sits at the right like the game's "Lv. 1 | Stats": white heavy text, a thin divider, and
  // "Locked" in grey when it can't be played.
  const meta = el('span', { className: 'tape-meta' },
    el('b', { className: 'tape-sys', textContent: SYSTEMS[cart.system] || cart.system }),
    el('i', { className: 'tape-div' }),
    locked ? el('span', { className: 'tape-state', textContent: 'Locked' }) : '');
  const play = el('button', { type: 'button', className: `zzz-round-action${onTV ? ' is-eject' : ''}`, disabled: busy || locked,
    title: locked ? 'PSP games are locked' : onTV ? 'Eject' : 'Play on TV',
    onclick: onTV ? () => run('Ejected.', () => select('')) : () => run(`${cart.title} is on the TV.`, () => select(cart.id)) });
  play.setAttribute('aria-label', onTV ? `Eject ${cart.title}` : `Play ${cart.title} on TV`);
  const shelfButton = el('button', { type: 'button', className: 'lib-move', textContent: tape ? '−' : '+', disabled: busy || (!tape && full),
    title: tape ? 'Take off the shelf' : full ? 'The shelf is full' : 'Add to the end of the shelf', onclick: () => putOnShelf(cart, !tape) });
  shelfButton.setAttribute('aria-label', tape ? `Take ${cart.title} off the shelf` : `Put ${cart.title} on the shelf`);
  const fold = el('button', { type: 'button', className: 'zzz-fold', title: shown ? 'Close' : 'Saves and Remove', onclick: () => { shown ? open.delete(cart.id) : open.add(cart.id); refresh(); } });
  fold.setAttribute('aria-expanded', String(shown));
  fold.setAttribute('aria-label', `${shown ? 'Close' : 'Open'} saves and Remove for ${cart.title}`);
  const row = el('div', { className: `tape-row game${onTV ? ' is-playing' : ''}${locked ? ' locked' : ''}` },
    grip, tape ? el('span', { className: 'tape-no', textContent: tapeText(tape) }) : '', title, meta,
    el('span', { className: 'tape-actions' }, play, shelfButton), fold);
  row.draggable = !busy && !editing;
  row.addEventListener('dragstart', event => { dragId = cart.id; event.dataTransfer.effectAllowed = 'move'; event.dataTransfer.setData('text/plain', cart.id); row.classList.add('is-dragging'); });
  row.addEventListener('dragend', () => { dragId = ''; row.classList.remove('is-dragging'); clearDrop(); });
  // Built like the game's skill panel: a grey card holding the black title bar, which grows to hold the
  // saves underneath when opened.
  return el('div', { className: `tape-item lib-card${shown ? ' is-open' : ''}` }, row, shown ? savesPanel(cart) : '');
}

const select = id => api('games.selection.save', { body: { id } }).then(() => '');

async function upload(files) {
  for (const file of files) {
    await run(`Added ${file.name}.`, async () => {
      say(`Adding ${file.name}…`);
      const result = await CompanionAPI.request('games.carts.add', { query: { name: file.name }, body: file }, { timeout: 300000 });
      return result.existing ? `${file.name} is already in the library as ${result.cart.title}; its saves are kept.` : `Added ${result.cart.title}.`;
    });
  }
}
$('file').addEventListener('change', () => upload([...$('file').files]));
const drop = $('drop');
for (const type of ['dragenter', 'dragover']) drop.addEventListener(type, event => { event.preventDefault(); drop.classList.add('over'); });
for (const type of ['dragleave', 'drop']) drop.addEventListener(type, () => drop.classList.remove('over'));
drop.addEventListener('drop', event => { event.preventDefault(); upload([...event.dataTransfer.files]); });

const pspLock = () => api('games.psp.get');

// The Controller section: the pad as the game station sees it, read every 100 ms while it is showing.
// Bits are the game station's buttons (face buttons by position: east A, south B, west Y, north X).
const PAD_BITS = { b: 0, y: 1, select: 2, start: 3, up: 4, down: 5, left: 6, right: 7, a: 8, x: 9, l: 10, r: 11, l2: 12, r2: 13, l3: 14, r3: 15 };
const padKey = (name, place) => { const key = el('span', { className: 'pad-key', textContent: name.toUpperCase() }); key.dataset.key = name; key.style.gridArea = place; return key; };
const stick = (id, place) => { const box = el('div', { className: 'pad-stick', id }, el('i')); box.style.gridArea = place; return box; };
// Laid out like the pad: shoulders on top, D-pad left, face buttons right, menu keys between, sticks below.
$('pad').append(
  el('p', { id: 'padStatus', className: 'pad-status', role: 'status' }),
  el('div', { className: 'pad-shape' },
    padKey('l2', 'l2'), padKey('l', 'l1'), padKey('r', 'r1'), padKey('r2', 'r2'),
    padKey('up', 'du'), padKey('left', 'dl'), padKey('right', 'dr'), padKey('down', 'dd'),
    padKey('select', 'sel'), padKey('start', 'sta'),
    padKey('x', 'fn'), padKey('y', 'fw'), padKey('a', 'fe'), padKey('b', 'fs'),
    stick('padLeft', 'ls'), stick('padRight', 'rs'), padKey('l3', 'l3'), padKey('r3', 'r3')),
  el('p', { className: 'pad-note', textContent: 'Xbox and PlayStation 4 / 5 pads work. Pair Bluetooth pads in Windows first.' }));
let padWas = null;
async function padTick() {
  const section = $('pad').closest('[data-section]');
  if (document.hidden || (section && section.hidden)) return;
  try {
    const state = await companionPadState(visit.signal);
    if (padWas !== state.connected) { padWas = state.connected; $('padStatus').classList.toggle('on', state.connected); $('padStatus').textContent = state.connected ? 'Controller connected' : 'No controller found. Connect one and press any button.'; }
    for (const node of $('pad').querySelectorAll('[data-key]')) node.classList.toggle('down', state.connected && Boolean(state.buttons & (1 << PAD_BITS[node.dataset.key])));
    for (const [id, x, y] of [['padLeft', state.axes[0], state.axes[1]], ['padRight', state.axes[2], state.axes[3]]]) {
      const dot = $(id).firstChild; dot.style.left = `${50 + x / 32767 * 40}%`; dot.style.top = `${50 + y / 32767 * 40}%`;
    }
  } catch { /* leaving the tab, or the companion is restarting */ }
}

// Leaving the Games tab stops its timer.
const visit = new AbortController();
document.addEventListener('zzz:leave', () => visit.abort(), { once: true });

refresh();
const poll = setInterval(() => { if (!busy && !document.hidden && !dragId && !$('games').contains(document.activeElement)) refresh(); }, 4000);
visit.signal.addEventListener('abort', () => clearInterval(poll));
// The Keyboard section, laid out like the game's Mouse & Keyboard settings: a row per button with its
// key in a keycap at the right. Choosing a row waits for a key; Escape cancels. A key another button
// has moves here, and that button takes this one's old key. Saved at once.
const KEY_ROWS = [
  ['Directions', [['up', 'Up'], ['down', 'Down'], ['left', 'Left'], ['right', 'Right']]],
  ['Buttons', [['a', 'A'], ['b', 'B'], ['y', 'Y'], ['x', 'X'], ['l', 'L'], ['r', 'R']]],
  ['Menu', [['start', 'Start'], ['select', 'Select']]],
];
const KEY_NAMES = { 0x08: 'Backspace', 0x09: 'Tab', 0x0D: 'Enter', 0x14: 'Caps Lock', 0x20: 'Space', 0x21: 'Page Up', 0x22: 'Page Down', 0x23: 'End', 0x24: 'Home',
  0x25: '←', 0x26: '↑', 0x27: '→', 0x28: '↓', 0x2D: 'Insert', 0x2E: 'Delete', 0x6A: 'Num *', 0x6B: 'Num +', 0x6D: 'Num -', 0x6E: 'Num .', 0x6F: 'Num /',
  0xBA: ';', 0xBB: '=', 0xBC: ',', 0xBD: '-', 0xBE: '.', 0xBF: '/', 0xC0: '`', 0xDB: '[', 0xDC: '\\', 0xDD: ']', 0xDE: "'" };
const RESERVED_KEYS = new Set([0x13, 0x1B, 0x10, 0x11, 0x12, 0x5B, 0x5C]);
const keyName = vk => KEY_NAMES[vk] || (vk >= 0x41 && vk <= 0x5A || vk >= 0x30 && vk <= 0x39 ? String.fromCharCode(vk)
  : vk >= 0x60 && vk <= 0x69 ? `Num ${vk - 0x60}` : vk >= 0x70 && vk <= 0x87 ? `F${vk - 0x6F}` : `Key ${vk}`);
let keys = null, waiting = '';

function renderKeys() {
  const box = $('keys');
  box.replaceChildren();
  if (!keys) { box.append(el('p', { className: 'empty', textContent: 'Loading keys…' })); return; }
  box.append(el('div', { className: 'keys-columns' }, el('span', { textContent: 'Keyboard' })));
  for (const [group, rows] of KEY_ROWS) {
    box.append(el('h3', { className: 'keys-group', textContent: group }));
    for (const [name, label] of rows) {
      const vk = keys.keys[name];
      const cell = el('button', { type: 'button', className: `keys-cell${waiting === name ? ' is-waiting' : ''}`, onclick: () => { waiting = waiting === name ? '' : name; renderKeys(); if (waiting) box.querySelector('.is-waiting')?.focus(); } },
        waiting === name ? el('span', { className: 'keys-wait', textContent: 'Press a key' }) : vk ? el('kbd', { className: 'keys-cap', textContent: keyName(vk) }) : el('span', { className: 'keys-none' }));
      cell.setAttribute('aria-label', `${label}: ${waiting === name ? 'press a key, or Escape to cancel' : vk ? keyName(vk) : 'no key'}. Press to change`);
      box.append(el('div', { className: 'keys-row' }, el('b', { className: 'keys-name', textContent: label }), cell));
    }
  }
  const reset = el('button', { type: 'button', className: 'zzz-chipbtn', textContent: 'Reset to defaults', onclick: () => saveKeys(null, 'Keys reset to the defaults.') });
  box.append(el('div', { className: 'keys-foot' }, el('small', { textContent: 'Pause starts and pauses play.' }), reset));
}

async function saveKeys(next, message) {
  try { keys = await companionSaveKeys(next); say(message); } catch (error) { say(error.message, 'error'); }
  renderKeys();
}

document.addEventListener('keydown', event => {
  if (!waiting) return;
  event.preventDefault();
  event.stopPropagation();
  const name = waiting, vk = event.keyCode;
  if (vk === 0x1B) { waiting = ''; renderKeys(); return; }
  if (RESERVED_KEYS.has(vk) || vk < 1 || vk > 254) { say('Pause, Escape, Shift, Ctrl, Alt and the Windows keys can\'t be game keys.', 'error'); return; }
  waiting = '';
  const next = { ...keys.keys };
  const other = Object.keys(next).find(key => key !== name && next[key] === vk);
  if (other) next[other] = next[name];
  next[name] = vk;
  saveKeys(next, other ? `${keyName(vk)} moved to ${name.toUpperCase()}; ${other.toUpperCase()} took its old key.` : `${name.toUpperCase()} is ${keyName(vk)}.`);
}, { capture: true, signal: visit.signal });

companionKeys().then(state => { keys = state; renderKeys(); }).catch(() => say('Could not read the keys.', 'error'));
renderKeys();

// The Storage section: the companion never deletes a game on its own, so removed games (with their
// saves) pile up in roms/.removed, and the weather map keeps the tiles it has shown. One button
// empties both, after saying what goes.
const bytes = n => n < 1048576 ? `${Math.max(1, Math.round(n / 1024))} KB` : `${(n / 1048576).toFixed(n < 10485760 ? 1 : 0)} MB`;
async function renderCache() {
  const box = $('cache');
  let use;
  try { use = await companionCacheUse(); } catch { box.replaceChildren(el('p', { className: 'empty', textContent: 'Could not read the storage use.' })); return; }
  const games = n => n === 1 ? '1 removed game' : `${n} removed games`;
  const nothing = !use.removedGames && !use.removedBytes && !use.mapBytes;
  const clear = el('button', { type: 'button', className: 'zzz-chipbtn danger', textContent: 'Clear cache', disabled: nothing, onclick: async () => {
    const now = await companionCacheUse();
    if (!await companionConfirm({
      title: 'Clear the cache for good?',
      message: `This deletes ${games(now.removedGames)} and their saves (${bytes(now.removedBytes)}), plus the weather map's saved tiles (${bytes(now.mapBytes)}). It cannot be undone. Games in your Library, their saves and their backups are not touched. The map tiles download again when the weather map needs them.`,
      confirmLabel: 'Clear' })) return;
    try { await companionClearCache(); say('Cache cleared.'); } catch (error) { say(error.message, 'error'); }
    renderCache();
  } });
  box.replaceChildren(el('div', { className: 'line' },
    el('small', { textContent: nothing ? 'Nothing to clear.' : `${games(use.removedGames)} and their saves (${bytes(use.removedBytes)}), plus the weather map's saved tiles (${bytes(use.mapBytes)}).` }),
    clear));
}
renderCache();

const padPoll = setInterval(padTick, 100);
visit.signal.addEventListener('abort', () => clearInterval(padPoll));
padTick();
</script>
</main></body></html>
